services:
  backend:
    image: nobugsme/nbank:with_fraud_check_with_transfer_fix
    ports:
      - "4111:4111"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      # Адрес мока фрод-сервиса. Порт обязан совпадать с FraudCheckWireMockExtension:
      # мок слушает на хосте, бэк стучится сюда. Разойдутся — бэк уйдёт в аварийную
      # ветку, и тесты на решения фрод-сервиса упадут.
      # Имя переменной соответствует property бэка fraud.detection.service.url;
      # изменения подхватываются только пересозданием контейнера (up -d --force-recreate),
      # docker compose restart читает старый конфиг.
      # 8089, а не 8080: 8080 на хосте занят selenoid-ui.
      # Адрес один для обоих сценариев: при прогоне из IDEA мок слушает на хосте,
      # при прогоне в Docker run-tests.sh пробрасывает 8089 контейнера с тестами на хост.
      - FRAUD_DETECTION_SERVICE_URL=http://host.docker.internal:8089
    depends_on:
      - postgres
    networks:
      - nbank-network

  # Легаси-версия бэка. Тесты ходят на неё при -DbackendVersion=V1
  # (порт задан в api.configs.BackendVersion).
  #
  # Своей БД у сервиса нет: судя по тегу, эта сборка ещё без внешнего хранилища.
  # Если при старте окажется, что датасорс ей всё-таки нужен — поднимаем отдельный
  # postgres-legacy со своим томом, а не переиспользуем соседний: две версии на одной
  # схеме nbank будут затирать данные друг другу.
  backend-legacy:
    image: nobugsme/nbank:with_validation_fix_with_swagger
    ports:
      - "4112:4111"
    networks:
      - nbank-network

  frontend:
    image: nobugsme/nbank-ui:latest
    expose: # не открываем порт наружу, а даем доступ контейнерам в сети
      - "80"
    depends_on:
      - backend
    networks:
      - nbank-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nbank-network

  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/:/etc/selenoid/:ro
    command: [ "-container-network", "nbank-network" ]
    environment:
      # Без этого Selenoid стучится в Docker по API 1.24, а новый Docker Engine
      # принимает минимум 1.40 -> "client version 1.24 is too old", браузер не стартует
      - DOCKER_API_VERSION=1.44
    depends_on:
      - frontend
    networks:
      - nbank-network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    ports:
      - "6567:8080"
    command: [ "--selenoid-uri", "http://selenoid:4444" ]
    depends_on:
      - selenoid
    networks:
      - nbank-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nbank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nbank"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nbank-network:
    name: nbank-network

volumes:
  postgres_data:
    driver: local