services:
  backend:
    image: nobugsme/nbank:with_database_with_fix_with_swagger
    ports:
      - "4111:4111"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      - postgres
    networks:
      - nbank-network

  # Легаси-версия бэка. Тесты ходят на неё при -DbackendVersion=V1
  # (порт задан в api.configs.BackendVersion).
  #
  # Своей БД у сервиса нет: судя по тегу, эта сборка ещё без внешнего хранилища.
  # Если при старте окажется, что датасорс ей всё-таки нужен — поднимаем отдельный
  # postgres-legacy со своим томом, а не переиспользуем соседний: две версии на одной
  # схеме nbank будут затирать данные друг другу.
  backend-legacy:
    image: nobugsme/nbank:with_validation_fix_with_swagger
    ports:
      - "4112:4111"
    networks:
      - nbank-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nbank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nbank"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nbank-network:
    name: nbank-network

volumes:
  postgres_data:
    driver: local